name: Update profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # allows manual trigger from Actions tab
  push:
    branches: [main]
    paths: ["generate_cards.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python generate_cards.py --user chahmadraza89 --out profile-cards

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-cards
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
